<div class="container-fluid min-vh-100 d-flex flex-column py-4 px-4 bg-gradient bg-primary-subtle position-relative">

  <!-- 🔒 Logout Button -->
  <div class="position-absolute top-0 end-0 m-4">
    <button class="btn btn-danger btn-sm px-3 py-2 fw-semibold shadow" (click)="logout()">
      <i class="bi bi-box-arrow-right me-1"></i> Logout
    </button>
  </div>

  <!-- 🧭 Dashboard Title -->
  <h3 class="text-dark mb-5 text-center fs-2 fw-bold text-uppercase">Admin Dashboard</h3>

<div class="row g-5 justify-content-center">
  <!-- Staff Management Card -->
  <div class="col-lg-9 col-md-8">
    <div class="card border-0 shadow-lg h-100 bg-white rounded-4 p-4"
         style="transition: transform 0.3s, box-shadow 0.3s;"
         onmouseover="this.style.transform='scale(1.02)'; this.style.boxShadow='0 0.75rem 1.5rem rgba(0,0,0,0.15)'"
         onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='0 0.5rem 1rem rgba(0,0,0,0.1)'">
      <div class="card-body d-flex flex-column justify-content-between gap-4 min-vh-75">
        <div>
          <h4 class="text-dark fw-bold">
            👥 Staff Management
            <span class="badge bg-light text-dark ms-2">Admin</span>
          </h4>
          <p class="text-dark fs-6">Add, edit, or remove staff members and manage their details.</p>
        </div>
        <a routerLink="/admin/staff-management"
           class="btn btn-outline-dark fw-semibold rounded-pill px-4 py-2"
           style="transition: background-color 0.3s, color 0.3s;"
           onmouseover="this.classList.add('bg-dark','text-white')"
           onmouseout="this.classList.remove('bg-dark','text-white')">
          Manage Staff
        </a>
      </div>
    </div>
  </div>

  <!-- Timetable Card -->
  <div class="col-lg-9 col-md-8">
    <div class="card border-0 shadow-lg h-100 bg-white rounded-4 p-4"
         style="transition: transform 0.3s, box-shadow 0.3s;"
         onmouseover="this.style.transform='scale(1.02)'; this.style.boxShadow='0 0.75rem 1.5rem rgba(0,0,0,0.15)'"
         onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='0 0.5rem 1rem rgba(0,0,0,0.1)'">
      <div class="card-body d-flex flex-column justify-content-between gap-4">
        <div>
          <h4 class="text-dark fw-bold">
            📅 Timetable
            <span class="badge bg-light text-dark ms-2">Schedule</span>
          </h4>
          <p class="text-dark fs-6">Assign shifts and view department schedules with ease.</p>
        </div>
        <a routerLink="/admin/timetable"
           class="btn btn-outline-dark fw-semibold rounded-pill px-4 py-2"
           style="transition: background-color 0.3s, color 0.3s;"
           onmouseover="this.classList.add('bg-dark','text-white')"
           onmouseout="this.classList.remove('bg-dark','text-white')">
          View Timetable
        </a>
      </div>
    </div>
  </div>
</div>

<router-outlet></router-outlet>
