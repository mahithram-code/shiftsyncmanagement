<div id="staff-page" class="container-fluid min-vh-100 d-flex flex-column py-4 px-4 bg-light gap-4">

  <!-- 🔧 Top-right Button Row -->
  <div class="d-flex justify-content-end align-items-center gap-3">
    <a routerLink="/staff/profile" class="btn btn-outline-primary btn-sm rounded-pill shadow-sm fw-bold text-uppercase border">
      <i class="bi bi-person-circle me-1"></i> Edit Profile
    </a>
    <button class="btn btn-danger btn-sm px-3 py-2 fw-bold shadow rounded-pill text-uppercase border" (click)="logout()">
      <i class="bi bi-box-arrow-right me-1"></i> Logout
    </button>
  </div>

  <!-- 🧑‍⚕️ Dashboard Header -->
  <div class="text-center">
    <h3 class="fw-bold text-dark text-uppercase ">👩‍⚕️ Staff Dashboard</h3>
    <p class="text-muted small mb-0">
      Welcome, <span class="fw-semibold text-primary">{{ staffName }}</span>! Here’s your upcoming shift schedule.
    </p>
  </div>

  <!-- 📅 Shift Table -->
  <div class="card border border-primary-subtle shadow-sm rounded-3 overflow-hidden">
    <div class="card-header bg-white border-bottom text-center">
      <h5 class="mb-0 text-dark fw-bold text-uppercase text-decoration-underline">Weekly Shift Schedule</h5>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover table-borderless table-striped table-sm align-middle text-center mb-0">
          <thead class="table-light text-capitalize">
            <tr class="text-nowrap">
              <th class="small text-muted">Date</th>
              <th class="small text-muted">Department</th>
              <th class="small text-muted">Shift Type</th>
            </tr>
          </thead>
          <tbody>
            @for (shift of shifts; track shift) {
              <tr>
                <td class="fw-semibold text-dark text-nowrap">{{ shift.shiftDate | date: 'mediumDate' }}</td>
                <td class="text-muted text-capitalize">{{ shift.department }}</td>
                <td>
                  <span 
                    class="badge rounded-pill px-3 py-2 text-white fw-semibold text-uppercase small border"
                    [class.bg-success]="shift.shiftType === 'Day Shift'"
                    [class.bg-dark]="shift.shiftType === 'Night Shift'"
                    [class.bg-secondary]="shift.shiftType !== 'Day Shift' && shift.shiftType !== 'Night Shift'">
                    {{ shift.shiftType }}
                  </span>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
